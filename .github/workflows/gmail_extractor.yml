name: Daily Gmail Extract + Supabase Sync
on:
  schedule:
    - cron: '0 12 * * *'  # Runs daily at 8am ET
  workflow_dispatch:       # Enables manual run from GitHub UI

jobs:
  run-extractor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gmail Extractor
        run: |
          python gmail_extractor.py
